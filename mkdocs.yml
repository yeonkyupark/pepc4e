      - "1.1 경쟁우위 생산전략": 01-production-strategy/01-competitive-strategy.md
      - "1.2 생산구조와 방식(Layout)": 01-production-strategy/02-production-system-layout.md
      - "1.3 구매와 외주전략": 01-production-strategy/03-purchasing-outsourcing.md
      - "1.4 인력과 직무설계": 01-production-strategy/04-workforce-job-design.md
      - "1.5 사업환경분석": 01-production-strategy/05-business-environment.md
